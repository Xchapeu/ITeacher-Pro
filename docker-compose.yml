services:
  mongo:
    image: mongo:6
    container_name: itacher_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itacher_backend
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=iteacher_db
      - JWT_SECRET=chave_secreta
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    ports:
      - "8001:8001"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itacher_frontend
    restart: unless-stopped
    environment:
      - VITE_BACKEND_URL=http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
